<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#1a0f2e"/><stop offset="1" stop-color="#3d1a5c"/></linearGradient></defs><rect width="1200" height="560" fill="url(#g)"/><rect x="65" y="50" width="1070" height="455" rx="20" fill="#2a1a3e" stroke="#6b2c91" stroke-width="3"/><text x="105" y="120" font-family="Arial,sans-serif" font-size="38" font-weight="bold" fill="#d4af37">Compartir inventario</text><text x="105" y="165" font-family="Arial,sans-serif" font-size="22" fill="#b8abc5">Crea un enlace privado para abrir la misma lista en otro dispositivo.</text><rect x="105" y="205" width="330" height="62" rx="10" fill="#5d267d"/><text x="270" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">Crear enlace compartido</text><rect x="465" y="205" width="440" height="62" rx="10" fill="#21152f" stroke="#76508e" stroke-width="2"/><text x="490" y="245" font-family="Arial,sans-serif" font-size="19" fill="#b8abc5">Pega aquí un enlace de invitación</text><rect x="935" y="205" width="155" height="62" rx="10" fill="none" stroke="#d4af37" stroke-width="2"/><text x="1012" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#d4af37">Unirme</text><rect x="105" y="315" width="985" height="115" rx="12" fill="#21152f" stroke="#6b2c91"/><text x="140" y="365" font-family="Arial,sans-serif" font-size="24" fill="#f7f3fa">✓ Lista compartida activa</text><text x="140" y="402" font-family="Arial,sans-serif" font-size="19" fill="#b8abc5">Los cambios se sincronizan automáticamente entre los dispositivos conectados.</text></svg>
